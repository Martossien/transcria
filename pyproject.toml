[tool.ruff]
line-length = 140

[tool.ruff.lint]
# `B` (flake8-bugbear) ajouté à la passe qualité d'août 2026 — il attrape des pièges que
# E,W,F ne voient pas, au premier chef `zip()` sans `strict=` qui TRONQUE en silence.
# `UP` ajouté ensuite (68 occurrences, toutes mécaniques : `typing.Callable` →
# `collections.abc`, annotations déquotées, modes d'ouverture redondants).
#
# De `SIM`, seules TROIS sous-règles sont retenues — les autres ont été examinées et
# écartées, avec leur raison (cf. docs/archive/PASSE_QUALITE_2026-08.md) :
#   · SIM108 (if/else → ternaire, 11) : souvent MOINS lisible sur une condition métier ;
#   · SIM115 (open sans contexte, 8) : FAUX POSITIFS ici — descripteurs volontairement
#     longue durée (flux d'envoi, journaux de sous-processus, timeline possédée) ;
#   · SIM105 (try/except/pass → suppress, 39) : les 24 sites SANS justification ont été
#     convertis, les 15 qui en portent une gardent leur `try/except` — la justification y
#     est visible, et `contextlib.suppress(Exception)` masquerait la nature aveugle de la
#     capture à un futur palier `BLE`.
# Un linter n'a pas toujours raison ; l'accepter en bloc aurait produit du bruit.
select = ["E", "W", "F", "I", "B", "UP", "SIM103", "SIM113", "SIM114"]

# Tri d'imports déterministe entre local et CI. Le dossier racine `alembic/`
# (migrations, sans __init__.py) est auto-détecté comme first-party par certaines
# versions de ruff → on force `alembic` en third-party (ce qu'il est) et on épingle
# nos paquets first-party.
[tool.ruff.lint.isort]
known-first-party = ["transcria", "inference_service", "connector_service"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# C5 : les corps des fonctions non annotées sont vérifiés aussi (plan §C5). Prévu
# « paquet par paquet » — l'arbre entier ne portait que 7 erreurs, activé d'un coup.
check_untyped_defs = true
# Un `# type: ignore` qui ne masque plus rien est de la FAUSSE protection : il fait
# croire à une difficulté résolue et peut avaler une VRAIE erreur apparue depuis.
# Les 8 trouvés à l'activation étaient tous périmés (5 masquaient un `arg-type`
# corrigé entre-temps) — aucun ne protégeait quoi que ce soit.
warn_unused_ignores = true

# Signatures obligatoires sur les paquets où un type manquant coûte le plus cher :
# `auth` (qui a le droit d'entrer), `ingestion` (ce qui vient des plateformes),
# `queue` (ce qui part sur le GPU). Le durcissement s'arrête là VOLONTAIREMENT :
# étendu à l'arbre entier il produirait des centaines d'annotations mécaniques sans
# rapport avec le risque. Élargir un paquet à la fois, jamais d'un bloc.
[[tool.mypy.overrides]]
module = ["transcria.auth.*", "transcria.ingestion.*", "transcria.queue.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "transcria.auth.models",
    "transcria.audit.models",
    "transcria.jobs.models",
    "transcria.jobs.timing_store",
    "transcria.voice.models",
    "transcria.queue.models",
    "transcria.context.central_lexicon_models",
    "transcria.context.meeting_type_models",
    "transcria.ingestion.models",
    "transcria.ingestion.session_models",
]
# Flask-SQLAlchemy : `class X(db.Model)` n'est pas reconnu par mypy comme base de classe
# (attribut d'instance, pas un nom typable). On suppresse UNIQUEMENT ce faux positif —
# le reste de ces modules est typé normalement (≠ ignore_errors en bloc).
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["backup", ".git", "__pycache__", ".venv", "node_modules"]
markers = [
    # Tests réseau sur un vrai socket TCP (faux serveurs en thread, sans GPU).
    # Cibler : pytest -m integration   |   exclure : pytest -m "not integration"
    "integration: test réseau sur un vrai socket TCP",
    # E2E réel exigeant Docker + GPU NVIDIA (install.sh en distro vierge → livrables).
    # Collecté partout, mais SKIPPÉ sauf TRANSCRIA_GPU_E2E=1 (machine GPU de l'opérateur).
    "gpu_e2e: E2E réel Docker+GPU (skip hors machine GPU)",
    # Smoke GPU RÉEL (C4, plan §3.14) : la frontière fakes ↔ matériel formalisée.
    # Collecté partout, SKIPPÉ sauf TRANSCRIA_GPU_REAL=1 (machine de dev GPU — PAS la CI).
    "gpu_real: smoke GPU réel (skip sauf TRANSCRIA_GPU_REAL=1)",
    "connector_real: intégration connecteur RÉELLE Docker (MinIO…) — skip sauf TRANSCRIA_CONNECTOR_REAL=1",
]
