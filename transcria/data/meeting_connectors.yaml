# Catalogue des CONNECTEURS DE RÉUNION — donnée, pas code.
#
# POURQUOI UN FICHIER DE DONNÉES : le cœur applicatif n'a pas le droit d'importer
# `connector_service` (contrat d'imports « Le cœur n'importe pas le service connecteur
# async »). La page d'administration ne peut donc pas interroger les connecteurs pour savoir
# ce qu'ils exigent — elle lit ce catalogue. Même motif que `meeting_types.yaml`.
#
# LE CHAMP `status` EST LE PLUS IMPORTANT. Il dit ce qui a été VÉRIFIÉ, pas ce qui est écrit :
#   validated     éprouvé en conditions réelles (réunion ou serveur réel), date à l'appui
#   implemented   le code existe et passe la CI, mais n'a JAMAIS été exécuté en vrai
#   planned       rien d'exploitable
# Un connecteur `implemented` affiché comme prêt tromperait l'exploitant : la distinction est
# le cœur de l'honnêteté de cette page.

schema_version: 1

connectors:
  - id: zoom-sdk
    name: Zoom
    path: bot                     # bot = capture live par participant ; webhook = post-réunion
    status: validated
    verified_on: "2026-07-27"
    summary: >-
      Bot natif (Meeting SDK). L'audio arrive par participant avec le nom du locuteur.
      Aucun port entrant à ouvrir.
    doc: docs/BOT_REUNION.md#6-bot-zoom-sdk-natif
    requires:
      - key: ZOOM_CLIENT_ID
        label: Client ID
        secret: false
      - key: ZOOM_CLIENT_SECRET
        label: Client Secret
        secret: true
    testable: true                # un vrai appel d'authentification est possible
    steps:
      - Se connecter à marketplace.zoom.us avec un compte ADMIN de l'organisation.
      - Volet en bas à gauche → Developer → Build an app → General app → Create.
      - Basic Info → relever Client ID et Client Secret (jeu « Development »).
      - Features → Embed → activer Meeting SDK.
      - Ne PAS publier l'app : elle reste interne à l'organisation.
      - >-
        Portail Zoom → Settings → Recording & Transcript → activer « Record to computer
        files », puis cocher « Internal meeting participants » sous « Who can request host
        permission to record? » (et « Auto approve » pour éviter un clic à chaque réunion).
    notes:
      - >-
        Portée : toutes les réunions de l'organisation, quel qu'en soit l'hôte. Aucune revue
        Zoom n'est nécessaire tant qu'on ne rejoint pas les réunions d'AUTRES organisations.

  - id: jitsi
    name: Jitsi
    path: bot
    status: validated
    verified_on: "2026-07-26"
    summary: >-
      Bot navigateur (Chromium headless) qui capte l'audio dans la page. Fonctionne sur une
      instance publique comme auto-hébergée.
    doc: docs/BOT_REUNION.md
    requires: []                  # une URL de salle suffit, aucun identifiant
    testable: false               # rien à tester hors d'une salle réelle
    steps:
      - Aucune inscription ni identifiant : fournir l'URL de la salle au lancement.
    notes:
      - >-
        L'identité des locuteurs est résolue à l'arrivée de leur piste et n'est pas
        rafraîchie ensuite (contrairement au bot Zoom).

  - id: visio
    name: Visio (La Suite numérique)
    path: native
    status: validated
    verified_on: "2026-07-26"
    summary: >-
      Transport natif LiveKit : le bot rejoint la salle comme participant caché et reçoit
      l'audio démultiplexé par participant. Voie OFFICIELLE, sans navigateur.
    doc: docs/TEMPS_REEL_REUNIONS.md
    requires:
      - key: LIVEKIT_URL
        label: URL du serveur LiveKit
        secret: false
      - key: LIVEKIT_API_KEY
        label: Clé d'API
        secret: false
      - key: LIVEKIT_API_SECRET
        label: Secret d'API
        secret: true
    testable: false
    steps:
      - Obtenir l'URL du serveur LiveKit et un couple clé/secret auprès de l'exploitant.
      - >-
        Poser LIVEKIT_URL, LIVEKIT_API_KEY et LIVEKIT_API_SECRET dans l'environnement du
        meeting-runner (propriété de la MACHINE, patron JITSI_XMPP_*) — le runner les
        relaie au bot, jamais dans argv.
      - >-
        Ajouter `visio` à `platforms:` dans runner.yaml puis redémarrer l'exécutant — la
        carte « Réunion » propose alors Visio (bot caché, pistes par participant natives).
    notes:
      - >-
        Le client LiveKit honore `http_proxy` mais IGNORE `no_proxy` : derrière un proxy
        d'entreprise, la connexion est rétablie par `connector_service/net_proxy.py`.
      - >-
        Salle publique : la room LiveKit est le SLUG de l'URL (vérifié dans la source
        officielle suitenumerique/meet, `core/api/viewsets.py`). Le bot est un participant
        CACHÉ : la garde BOT_IDLE_TIMEOUT_S (15 min sans audio) évite qu'il maintienne
        ouverte une salle désertée.

  - id: zoom-rtms
    name: Zoom RTMS
    path: webhook
    status: implemented
    summary: >-
      Flux média temps réel officiel de Zoom, sans bot dans la réunion. Alternative au bot
      quand l'organisation préfère qu'aucun participant ne s'ajoute.
    doc: docs/TEMPS_REEL_REUNIONS.md#7-bis
    requires:
      - key: ZOOM_RTMS_CLIENT_ID
        label: Client ID de l'app RTMS
        secret: false
      - key: ZOOM_RTMS_CLIENT_SECRET
        label: Client Secret
        secret: true
      - key: ZOOM_WEBHOOK_SECRET_TOKEN
        label: Jeton secret du webhook
        secret: true
    testable: false
    steps:
      - Activer RTMS sur le compte Zoom (crédits Developer Pack requis).
      - Déclarer un point d'entrée HTTPS PUBLIC pour recevoir `meeting.rtms_started`.
    notes:
      - >-
        ⚠ EXIGE UNE OUVERTURE DE PARE-FEU. Zoom pousse l'évènement de démarrage vers un point
        d'entrée HTTPS joignable depuis Internet ; seuls les flux média sont ensuite sortants.
        C'est la différence majeure avec le bot, qui n'exige aucun port entrant.
      - Jamais exécuté contre un vrai flux RTMS.

  - id: teams
    name: Microsoft Teams
    path: webhook
    status: implemented
    summary: >-
      Notifications Microsoft Graph : le portail est prévenu dès qu'un ENREGISTREMENT est
      disponible, puis le télécharge et le traite avec notre propre chaîne. Aucun bot dans
      la réunion.
    doc: docs/TEMPS_REEL_REUNIONS.md#7-bis
    requires:
      - key: TEAMS_TENANT_ID
        label: Identifiant de locataire (Entra ID)
        secret: false
      - key: TEAMS_CLIENT_ID
        label: Client ID de l'application
        secret: false
      - key: TEAMS_CLIENT_SECRET
        label: Client Secret
        secret: true
      - key: TEAMS_CLIENT_STATE
        label: Secret partagé des notifications (clientState)
        secret: true
      - key: TEAMS_NOTIFICATION_URL
        label: URL publique de réception des notifications
        secret: false
    testable: false
    steps:
      - Enregistrer une application dans Entra ID (Azure AD) et créer un Client Secret.
      - >-
        Accorder la permission APPLICATIVE « OnlineMeetingRecording.Read.All », puis le
        consentement administrateur. (« OnlineMeetingTranscript.Read.All » n'est utile que
        si l'on veut aussi la transcription produite par Teams — ce n'est pas notre cas.)
      - >-
        Créer une politique d'accès applicatif en PowerShell
        (`New-CsApplicationAccessPolicy`) et l'accorder aux utilisateurs concernés : sans
        elle, l'application ne voit les artefacts d'aucun organisateur.
      - >-
        Exposer DEUX points d'entrée HTTPS publics : l'un pour les notifications, l'autre
        pour le cycle de vie. Graph exige le second dès qu'un abonnement dure plus d'une
        heure, et refuse tout schéma autre que HTTPS.
      - Vérifier que l'enregistrement de réunion est autorisé par la politique du locataire.
    notes:
      - >-
        Depuis le 25 août 2025, ces API Graph NE SONT PLUS FACTURÉES : aucun abonnement Azure
        n'est nécessaire.
      - >-
        Le réglage « Transcript API access », imposé au 29 juillet 2026 et désactivé par
        défaut, ne concerne QUE les transcriptions — les abonnements aux enregistrements n'en
        dépendent pas.
      - >-
        Aucun certificat de chiffrement n'est requis : nous n'activons pas les données de
        ressource, l'évènement ne portant qu'une référence que l'on résout ensuite.

  - id: meet
    name: Google Meet
    path: pull
    status: implemented
    summary: >-
      Google Workspace Events publie dans une file Pub/Sub que le portail INTERROGE (pull) :
      il apprend qu'un enregistrement existe, puis le récupère par l'API Meet et Drive.
      Aucun bot, et surtout AUCUN port entrant.
    doc: docs/TEMPS_REEL_REUNIONS.md#7-quater
    requires:
      - key: MEET_SERVICE_ACCOUNT_EMAIL
        label: Adresse du compte de service
        secret: false
      - key: MEET_SERVICE_ACCOUNT_KEY
        label: Clé privée du compte de service (JSON)
        secret: true
      - key: MEET_DELEGATED_USER
        label: Utilisateur représenté (délégation)
        secret: false
      - key: MEET_PUBSUB_SUBSCRIPTION
        label: Abonnement Pub/Sub à interroger
        secret: false
    testable: false
    steps:
      - >-
        Créer un projet Google Cloud, puis activer les API « Google Meet », « Google Workspace
        Events », « Google Drive » et « Pub/Sub ».
      - Créer un compte de service et générer sa clé privée JSON.
      - >-
        Dans la console d'administration Workspace, accorder la DÉLÉGATION À L'ÉCHELLE DU
        DOMAINE au compte de service pour les portées Meet et Drive : sans elle, le compte
        n'agit que pour lui-même et ne voit AUCUN artefact de réunion (symptôme : des 404 sur
        des ressources qui existent).
      - >-
        Créer un sujet Pub/Sub, puis y autoriser le publicateur
        `meet-api-event-push@system.gserviceaccount.com` — sans ce droit, l'abonnement est
        accepté et ne délivre jamais rien.
      - >-
        Créer un abonnement Pub/Sub de type PULL (surtout pas « push ») : c'est lui qui évite
        toute ouverture de pare-feu.
    notes:
      - >-
        Voie la plus facile à faire accepter par une DSI : tout est SORTANT, à la différence de
        Teams et de Zoom RTMS.
      - >-
        Les abonnements Workspace Events durent au maximum SEPT JOURS et doivent être
        renouvelés ; le portail s'en charge (`connector_service/subscription_renewal.py`).
      - >-
        L'évènement ne porte qu'une RÉFÉRENCE (`conferenceRecords/…`) : le média est ensuite
        récupéré par l'API. Ce n'est pas une limite de notre code mais du format Google.
      - Un abonnement Google Workspace (payant) est requis ; un compte Gmail ne suffit pas.
      - Jamais exécuté contre une vraie conférence.
